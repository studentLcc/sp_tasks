- id: sp_tasks_daily_summary
alias: Super Productivity 每日任务摘要
description: 每天 07:00 先组装天气和任务，再调用一次 Server酱 rest_command
trigger:
  - platform: time
    at: "07:00:00"
action:
  - action: qweather_pro.get_weather
    target:
      entity_id: weather.zhu_jin_he_feng_tian_qi_zhu_jin_weather
    data:
      keys:
        - now
        - weather_abstract
        - city
        - daily
        - aqi
        - indices
        - minutely_summary
        - update_time
    response_variable: wx
  - action: sp_tasks.get_tasks
    response_variable: task
  - action: rest_command.your_serverchan_command
    data:
      title: |
        {% set verse = {
          '晴': '晴光正好',
          '少云': '云影轻移',
          '多云': '云淡风轻',
          '阴': '天色微阴',
          '阵雨': '一阵疏雨',
          '雷阵雨': '雷雨初来',
          '小雨': '细雨如丝',
          '中雨': '雨声淅沥',
          '大雨': '雨势正浓',
          '暴雨': '急雨敲窗',
          '雨夹雪': '雨雪纷纷',
          '小雪': '小雪初霁',
          '中雪': '雪落无声',
          '大雪': '大雪纷飞',
          '雾': '雾锁城隅',
          '霾': '烟霭朦胧'
        }.get(wx.now.text_cn, '天气正好') %}
        {{ wx.city }} · {{ verse }}
      tags: "天气"
      desp: |
        {% set weather_icon = {
          '晴': '☀️',
          '少云': '🌤️',
          '多云': '⛅',
          '阴': '☁️',
          '阵雨': '🌦️',
          '雷阵雨': '⛈️',
          '小雨': '🌦️',
          '中雨': '🌧️',
          '大雨': '🌧️',
          '暴雨': '⛈️',
          '雨夹雪': '🌨️',
          '小雪': '🌨️',
          '中雪': '❄️',
          '大雪': '❄️',
          '雾': '🌫️',
          '霾': '😷'
        }.get(wx.now.text_cn, '🌈') %}
        **{{ weather_icon }} 实时状况**

        {{ weather_icon }} {{ wx.now.text_cn }}，当前 {{ wx.now.temp | round(1) }}℃（体感 {{ wx.now.feelsLike | round(1) }}℃）

        # 📅 今日预报

        - ☀️ 白天：{{ wx.daily[0].daytime.text }}，最高温 {{ wx.daily[0].temp_max | round(0) }}℃

        - 🌙 夜间：{{ wx.daily[0].nighttime.text }}，最低温 {{ wx.daily[0].temp_min | round(0) }}℃

        - 💨 风向：{{ wx.now.windDir }} {{ wx.now.windScale }}级

        **😷 空气质量**

        {{ wx.aqi.category }}（AQI：{{ wx.aqi.aqi }}），首要污染物：{{ wx.aqi.primary | default('无') }}

        **👕 穿衣指南**

        {{ wx.indices[2].brf }}：{{ wx.indices[2].txt }}

        **🌧️ 降水提醒**

        {{ wx.minutely_summary }}

        > 更新时间：{{ wx.update_time }}

        # 📋 今日任务

        **⚠️ 已过期（{{ task.overdue | count }}）**

        {% for item in task.overdue %}
        - {{ item.title }}

        {% else %}
        无

        {% endfor %}
        **📌 今天（{{ task.today | count }}）**

        {% for item in task.today %}
        - {{ item.title }}

        {% else %}
        无

        {% endfor %}
        **🗓️ 一周内（{{ task.week | count }}）**

        {% for item in task.week %}
        - {{ item.title }}

        {% else %}
        无

        {% endfor %}

        **📭 未安排（{{ task.unscheduled | count }}）**

        {% for item in task.unscheduled %}
        - {{ item.title }}

        {% else %}
        无

        {% endfor %}
mode: single
