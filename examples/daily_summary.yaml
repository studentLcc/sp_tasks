- id: sp_tasks_daily_summary
alias: Super Productivity 每日任务摘要
description: 每天 07:00 把已分类任务交给现有 Server酱 rest_command
trigger:
  - platform: time
    at: "07:00:00"
action:
  - action: rest_command.your_serverchan_command
    data:
      title: "任务（{{ state_attr('sensor.sp_tasks_today', 'date') }}）"
      tags: "任务"
      desp: >
        {% set g = state_attr('sensor.sp_tasks_today', 'groups') %}

        **已过期（{{ g.overdue | count }}）**

        {% for item in g.overdue %}
        - {{ item.title }}
        {% if item.schedule_time %}  时间：{{ item.schedule_time }}
        {% endif %}{% if item.notes and item.notes != '无' %}  内容：{{ item.notes }}
        {% endif %}
        {% else %}
        无
        {% endfor %}

        **今天（{{ g.today | count }}）**

        {% for item in g.today %}
        - {{ item.title }}
        {% if item.schedule_time %}  时间：{{ item.schedule_time }}
        {% endif %}{% if item.notes and item.notes != '无' %}  内容：{{ item.notes }}
        {% endif %}
        {% else %}
        无
        {% endfor %}

        **一周内（{{ g.week | count }}）**

        {% for item in g.week %}
        - {{ item.title }}
        {% if item.schedule_time %}  时间：{{ item.schedule_time }}
        {% endif %}{% if item.notes and item.notes != '无' %}  内容：{{ item.notes }}
        {% endif %}
        {% else %}
        无
        {% endfor %}
mode: single
